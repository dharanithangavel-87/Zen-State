<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>ZenState | Wellness Plans</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="zen-navbar">
        <div class="nav-brand-group">ZenState</div>
        <div class="nav-links-cluster">
            <a href="dashboard.html">Home</a>
            <a href="meditation.html">Manage Sessions</a>
            <a href="wellness.html" class="active">Manage Plans</a>
            <a href="alerts.html">Alerts</a>
            <a href="profile.html">Profile</a>
        </div>
        <div class="user-profile-badge">
            <div class="avatar-circle" id="userInitial"></div>
            <span id="usernameAndRole"></span>
            <a href="#" onclick="logout(); return false;" class="logout-anchor">Logout</a>
        </div>
    </nav>
    
    <div class="container py-5" style="max-width: 1200px;">
        <div class="d-flex justify-content-between mb-4">
            <h1>Wellness Strategies</h1>
            <button id="addPlanBtn" class="btn-action-outline" style="background:#112d24; color:white; display:none;" onclick="togglePForm()">+ Create Plan</button>
        </div>
        
        <div id="pDrawer" class="panel-white" style="display:none; max-width:500px;">
            <form onsubmit="savePlan(event)">
                <div class="form-group">
                    <label class="form-label">Plan Name</label>
                    <input type="text" id="pName" class="form-control" placeholder="e.g., Corporate Fitness Challenge" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Target Goal</label>
                    <input type="text" id="pGoal" class="form-control" placeholder="e.g., Improve mindfulness routine" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Capacity Limit</label>
                    <input type="number" id="pCap" class="form-control" placeholder="e.g., 50" required>
                </div>
                <button type="submit" class="btn-submit">Publish Strategy Plan</button>
            </form>
        </div>
        
        <div class="panel-white p-0">
            <table class="table m-0">
                <thead>
                    <tr>
                        <th>Plan Name</th>
                        <th>Target Goal</th>
                        <th>Capacity</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody id="wellTable"></tbody>
            </table>
        </div>
    </div>
    
    <script src="../javascript/config.js"></script>
    <script src="../javascript/store.js"></script>
    <script src="../javascript/guard.js"></script>
    <script src="../javascript/auth.js"></script>
    <script src="../javascript/wellness.js"></script>
</body>
</html>
