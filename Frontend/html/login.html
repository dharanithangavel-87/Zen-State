<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>ZenState | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div style="text-align: center; margin-bottom: 2rem;">
                <i class="bi bi-flower1" style="font-size: 50px; color: #112d24;"></i>
                <h2 style="margin-top: 10px;">Welcome Back</h2>
            </div>
            <form onsubmit="login(event)">
                <div class="form-group"><label class="form-label">Email Address</label><input type="email" class="form-control" id="email" required></div>
                <div class="form-group"><label class="form-label">Password</label><input type="password" class="form-control" id="password" required></div>
                <button class="btn-submit" type="submit">Sign In to ZenState</button>
            </form>
            <div style="text-align: center; margin-top: 2rem; font-size: 0.85rem;"><a href="register.html" style="color: #d97706; text-decoration: none; font-weight: 600;">Create account</a></div>
        </div>
    </div>
    <script src="../javascript/config.js"></script><script src="../javascript/store.js"></script><script src="../javascript/auth.js"></script>
</body>
</html>
