<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>ZenState | Meditation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="zen-navbar">
        <div class="nav-brand-group">ZenState</div>
        <div class="nav-links-cluster"><a href="dashboard.html">Home</a><a href="meditation.html" class="active">Manage Sessions</a><a href="wellness.html">Manage Plans</a><a href="alerts.html">Alerts</a><a href="profile.html">Profile</a></div>
        <div class="user-profile-badge"><div class="avatar-circle" id="userInitial"></div><span id="usernameAndRole"></span><a href="#" onclick="logout(); return false;" class="logout-anchor">Logout</a></div>
    </nav>
    <div class="container py-5" style="max-width: 1200px;">
        <div class="d-flex justify-content-between align-items-center mb-4"><h1>Meditation Studio</h1><button id="openSessionCreatorBtn" class="btn-action-outline" style="background:#112d24; color:white; display:none;" onclick="toggleForm()">+ Create New Session</button></div>
        
        <div id="formDrawer" class="panel-white" style="display:none; max-width:500px;">
            <form id="sessForm" onsubmit="createSess(event)">
                <div class="form-group">
                    <label class="form-label">Title</label>
                    <input type="text" id="sTitle" class="form-control" placeholder="e.g., Deep Focus Routine" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Category</label>
                    <select id="sCat" class="form-control" style="background-color: white; height: 45px;">
                        <option value="FOCUS">FOCUS</option>
                        <option value="ANXIETY">ANXIETY</option>
                        <option value="SLEEP">SLEEP</option>
                        <option value="STRESS">STRESS</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Duration (Minutes)</label>
                    <input type="number" id="sDur" class="form-control" placeholder="e.g., 15" required>
                </div>
                <button type="submit" class="btn-submit">Publish Session</button>
            </form>
        </div>
        <div class="panel-white p-0"><table class="table m-0"><thead><tr><th>Title</th><th>Category</th><th>Duration</th><th class="text-end">Actions</th></tr></thead><tbody id="medTable"></tbody></table></div>
    </div>
    <script src="../javascript/config.js"></script><script src="../javascript/store.js"></script><script src="../javascript/guard.js"></script><script src="../javascript/auth.js"></script><script src="../javascript/meditation.js"></script>
</body>
</html>
