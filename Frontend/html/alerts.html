<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>ZenState | Alerts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="zen-navbar">
        <div class="nav-brand-group">ZenState</div>
        <div class="nav-links-cluster">
            <a href="dashboard.html">Home</a>
            <a href="meditation.html">Manage Sessions</a>
            <a href="wellness.html">Manage Plans</a>
            <a href="alerts.html" class="active">Alerts</a>
            <a href="profile.html">Profile</a>
        </div>
        <div class="user-profile-badge">
            <div class="avatar-circle" id="userInitial"></div>
            <span id="usernameAndRole"></span>
            <a href="#" onclick="logout(); return false;" class="logout-anchor">Logout</a>
        </div>
    </nav>
    
    <div class="container py-5" style="max-width: 1200px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>System Bulletins</h1>
            <button id="openAlertCreatorBtn" class="btn-action-outline" style="background:#112d24; color:white; display:none;" onclick="toggleAlertForm()">+ Broadcast Alert</button>
        </div>
        
        <div id="alertDrawer" class="panel-white mb-4" style="display:none; max-width:600px;">
            <form onsubmit="broadcastAlert(event)">
                <div class="form-group">
                    <label class="form-label">Broadcast Announcement Message</label>
                    <textarea id="alertText" class="form-control" rows="3" placeholder="Type global system alert announcement here..." style="resize: none;" required></textarea>
                </div>
                <button type="submit" class="btn-submit">Issue System Broadcast</button>
            </form>
        </div>
        
        <div id="feed" class="mt-4"></div>
    </div>
    
    <script src="../javascript/config.js"></script>
    <script src="../javascript/store.js"></script>
    <script src="../javascript/guard.js"></script>
    <script src="../javascript/auth.js"></script>
    <script src="../javascript/alerts.js"></script>
</body>
</html>
